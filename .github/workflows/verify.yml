name: Verify Raster Type
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    uses: edigonzales/hop-plugin-ci/.github/workflows/verify.yml@f0a1eec368cb8c5d2592086b26393a6fc3916ad1
    with:
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-goals: clean verify
      compatibility-goals: test
      pom-file: assemblies/pom.xml
      artifact-name-prefix: hop-raster-type-plugin
      artifacts: >-
        [{"pom":"pom.xml"},
         {"file":"assemblies/target/hop-raster-type-plugin-*.zip","pom":"assemblies/pom.xml"},
         {"file":"hop-raster-core/target/hop-raster-core-*-SNAPSHOT.jar","pom":"hop-raster-core/pom.xml"},
         {"file":"hop-raster-type/target/hop-raster-type-*-SNAPSHOT.jar","pom":"hop-raster-type/pom.xml"},
         {"file":"hop-raster-geotools/target/hop-raster-geotools-*-SNAPSHOT.jar","pom":"hop-raster-geotools/pom.xml"}]
      validation-command: |
        python scripts/verify-package.py

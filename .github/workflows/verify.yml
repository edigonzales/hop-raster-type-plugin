name: Verify Raster Type
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-verify.yml@990af4813013fa8d21f6447e7545ed5499f2f202
    with:
      ci-ref: 990af4813013fa8d21f6447e7545ed5499f2f202
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "macos-15", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-goals: clean verify
      compatibility-goals: test
      pom-file: assemblies/pom.xml
      zip-glob: assemblies/target/hop-raster-type-plugin-*.zip
      plugin-root: plugins/misc/hop-raster-type
      artifact-name-prefix: hop-raster-type-plugin
      group-id: ch.so.agi
      artifact-id: hop-raster-type-plugin
      hop-version: 2.19.0
      validation-commands: '["python -m unittest discover -s scripts -p test_*.py", "python scripts/verify-package.py", "python scripts/stage-artifacts.py"]'
      additional-verified-files: '["pom.xml", "target/publication/hop-raster-core.pom", "target/publication/hop-raster-core-0.1.0-SNAPSHOT.jar", "target/publication/hop-raster-type.pom", "target/publication/hop-raster-type-0.1.0-SNAPSHOT.jar", "target/publication/hop-raster-geotools.pom", "target/publication/hop-raster-geotools-0.1.0-SNAPSHOT.jar"]'
